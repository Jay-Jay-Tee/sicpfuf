name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # sicpfuf is written for Python 3.9 and later; test on the oldest one.
    container: python:3.9-slim
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/run_tests.py
      - run: python3 -m unittest discover -s tests -p 'test_*.py'

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - run: npm install --prefix "$RUNNER_TEMP/sicpfuf-ui" --no-audit --no-fund jsdom@30.1.3 pyodide@0.29.4
      - run: node tests/ui.cjs "$RUNNER_TEMP/sicpfuf-ui/node_modules/jsdom"
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build --strict
      - run: node tests/website_ui.cjs "$RUNNER_TEMP/sicpfuf-ui/node_modules/jsdom" site
      - run: node --experimental-vm-modules tests/website_worker.mjs "$RUNNER_TEMP/sicpfuf-ui/node_modules/pyodide/pyodide.mjs" site

  docs:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [test, ui]
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
