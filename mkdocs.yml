site_name: sicpfuf
site_url: https://jay-jay-tee.github.io/sicpfuf/
site_description: SICP in Python, with x-ray vision. A finals kit, drills, an easy textbook and a tiny interpreter for Python §1–§4 that shows you the substitution model and the environment model step by step.
site_author: Jay-Jay-Tee
repo_url: https://github.com/Jay-Jay-Tee/sicpfuf
repo_name: Jay-Jay-Tee/sicpfuf
edit_uri: edit/main/docs/
copyright: sicpfuf is an unofficial study companion, MIT licensed. Not affiliated with the SICPy authors, Source Academy or any university.

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.footer
    - navigation.top
    - navigation.tracking
    - navigation.tabs
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github
    logo: material/magnify-scan
  favicon: assets/favicon.svg

extra_css:
  - assets/extra.css
extra_javascript:
  - assets/exam-timer.js
  - assets/playground.js

hooks:
  - scripts/build_playground.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Getting started: start.md
  - Visual steppers: playground.md
  - Finals kit:
      - finals/index.md
      - Topic checklist: finals/checklist.md
      - One-page sheets:
          - finals/sheets/index.md
          - Substitution model & processes: finals/sheets/substitution.md
          - Orders of growth: finals/sheets/growth.md
          - Scope & higher-order functions: finals/sheets/scope-hof.md
          - Pairs, llists & box-and-pointer: finals/sheets/llists.md
          - Trees & CPS: finals/sheets/trees-cps.md
          - Streams: finals/sheets/streams.md
          - The environment model: finals/sheets/environment-model.md
          - Mutation, lists & loops: finals/sheets/mutation-lists-loops.md
          - Memoization, searching & sorting: finals/sheets/memo-search-sort.md
          - The metacircular evaluator: finals/sheets/mce.md
          - Typed Python §4: finals/sheets/types.md
          - The classic traps: finals/sheets/traps.md
      - Exam mode: finals/exam-mode.md
      - Mock final 1: finals/mock-1.md
      - Mock final 2: finals/mock-2.md
      - Mock final 3: finals/mock-3.md
  - The Book:
      - book/index.md
      - "Unit 1 · Functions":
          - book/01-elements.md
          - book/02-runes.md
          - book/03-substitution-recursion.md
          - book/04-orders-of-growth.md
          - book/05-higher-order-scope.md
          - book/06-curves-sound.md
      - "Unit 2 · Data":
          - book/07-data-abstraction.md
          - book/08-llist-processing.md
          - book/09-trees-cps.md
          - book/10-sorting-symbolic.md
          - book/11-streams.md
      - "Unit 3 · State":
          - book/12-state-mutation.md
          - book/13-lists-loops.md
          - book/14-environment-model.md
          - book/15-search-sort-memo.md
          - book/16-streams-ii.md
      - "Unit 4 · Beyond":
          - book/17-mce.md
          - book/18-mce-lazy.md
          - book/19-types-objects.md
          - book/20-big-picture.md
      - book/glossary.md
  - Drills:
      - practice/index.md
      - practice/01-elements.md
      - practice/02-substitution-processes.md
      - practice/03-orders-of-growth.md
      - practice/04-hof-scope.md
      - practice/05-llists-box-pointer.md
      - practice/06-llist-processing.md
      - practice/07-trees-cps.md
      - practice/08-sorting-symbolic-streams.md
      - practice/09-state-mutation.md
      - practice/10-lists-loops.md
      - practice/11-environment-model.md
      - practice/12-memo-search-sort.md
      - practice/13-streams-ii.md
      - practice/14-mce.md
      - practice/15-types.md
  - Reference:
      - reference/index.md
      - reference/language.md
      - reference/library.md
      - reference/errors.md
      - reference/xray.md
      - reference/internals.md
